name: Claude handles issues

# Marketing files a plain-English issue (or comments @claude on an existing one,
# or labels/assigns it "claude"). Claude reads the repo (guided by /CLAUDE.md),
# asks clarifying questions if needed, then opens a PR with the changes.
#
# Auth:
#   CLAUDE_CODE_OAUTH_TOKEN — Claude Max/Pro subscription token, generated with
#     `claude setup-token` (uses the subscription, not API credits).
#   CLAUDE_GITHUB_TOKEN — a fine-grained GitHub PAT scoped to this repo, used
#     for checkout and Claude's branch/PR/comment operations.

on:
  issues:
    types: [opened, labeled, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  # When a NEW issue is opened by someone with write access, add the `claude`
  # label. Adding it with the PAT fires an `issues.labeled` event, which triggers
  # the `claude` job below in tag mode (giving the proper branch+PR flow). This is
  # what makes "just open an issue -> Claude runs" work without anyone typing
  # @claude. The author permission check keeps random public-repo issues from
  # triggering Claude runs. (Labels applied at creation time do NOT fire a
  # trigger, which is why the `claude` label was removed from the issue
  # templates — this job re-adds it fresh so the event fires.)
  autolabel:
    if: github.event_name == 'issues' && github.event.action == 'opened'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Add `claude` label if the issue author can write
        env:
          GH_TOKEN: ${{ secrets.CLAUDE_GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          perm=$(gh api "repos/$REPO/collaborators/$AUTHOR/permission" -q '.permission' 2>/dev/null || echo none)
          echo "Issue author $AUTHOR has '$perm' permission"
          case "$perm" in
            admin|write|maintain)
              gh issue edit "$ISSUE" --repo "$REPO" --add-label claude
              echo "Added 'claude' label — Claude will run." ;;
            *)
              echo "Author lacks write access; not triggering Claude." ;;
          esac

  claude:
    # Ways to trigger:
    #   1. Open a new issue (the autolabel job above adds `claude` -> fires here).
    #   2. Comment @claude on an issue or PR.
    #   3. Label an issue `claude` or assign it to `claude`.
    if: |
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.CLAUDE_GITHUB_TOKEN }}

      # OCR toolchain for the `programme-metadata` skill (.claude/skills/…),
      # which turns a scanned programme PDF into on-page cast/crew data.
      # poppler-utils = pdftoppm/pdftotext, tesseract = OCR, pypdf = embedded-text.
      # Pre-installed here so Claude never needs apt/pip at runtime.
      - name: Install programme-OCR tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils tesseract-ocr tesseract-ocr-eng python3-pip
          pip3 install --break-system-packages pypdf

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Exposed to Claude's shell so it can download issue attachments, which
          # live at github.com/user-attachments/... and require authentication
          # (they are NOT public, even on a public repo). See CLAUDE.md.
          GH_ATTACHMENT_TOKEN: ${{ secrets.CLAUDE_GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_GITHUB_TOKEN }}
          # curl: download images (issue attachments need the auth header above;
          #   pasted public URLs don't). convert/magick: resize or convert an
          #   asset to a web-friendly format when marketing supplies the wrong one.
          # pdftoppm/pdftotext/tesseract/python3 + the skill's extract-text.sh:
          #   the programme-metadata OCR skill. Without these on the allow-list,
          #   the Action blocks them (no interactive approval in CI) and OCR fails.
          # npm audit / npm audit fix: let Claude inspect and fix dependency
          #   vulnerabilities raised by the nightly security-audit workflow.
          claude_args: "--allowedTools 'Bash(npm ci),Bash(npm install *),Bash(npm run *),Bash(npm audit),Bash(npm audit *),Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(curl:*),Bash(convert:*),Bash(magick:*),Bash(pdftoppm:*),Bash(pdftotext:*),Bash(tesseract:*),Bash(python3:*),Bash(.claude/skills/programme-metadata/scripts/extract-text.sh:*)'"

      # The action pushes a branch and posts a "Create PR" link but does NOT open
      # the PR itself. Open it automatically so the flow is hands-off end to end:
      # issue -> branch -> PR. A human still reviews and merges (branch protection
      # + CODEOWNERS), which is what triggers the site rebuild. `branch_name` is
      # empty unless Claude actually created a branch, so nothing opens on a no-op
      # (e.g. a question-only reply). Issue title/number go through env vars, not
      # inline ${{ }}, so a crafted issue title can't inject shell.
      # Opening a PR from a workflow needs ONE of: (a) repo setting
      # "Allow GitHub Actions to create and approve pull requests" ON (for the
      # built-in GITHUB_TOKEN used here), or (b) a PAT with Pull requests: write
      # (our fine-grained PAT currently lacks it). Until one is in place this step
      # is a NO-OP-on-failure: it logs a warning but does not fail the run, and the
      # action's own "Create PR" link in Claude's comment still works.
      - name: Open the pull request for Claude's branch
        if: steps.claude.outputs.branch_name != '' && (github.event_name == 'issues' || github.event_name == 'issue_comment')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
          BRANCH: ${{ steps.claude.outputs.branch_name }}
          ISSUE: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
          # True when the triggering issue is a `security` one (from the nightly
          # security-audit workflow) — those PRs are infrastructural, so we assign
          # them to Roger for sign-off. CODEOWNERS on package-lock.json already
          # makes his review required to merge.
          IS_SECURITY: ${{ contains(github.event.issue.labels.*.name, 'security') }}
        run: |
          if [ -n "$(gh pr list --repo "$REPO" --head "$BRANCH" --json number -q '.[0].number')" ]; then
            echo "A PR already exists for $BRANCH — nothing to do."
            exit 0
          fi
          # First body line is a plain-English one-liner of what changed — the
          # marketing dashboard shows it, so lead with Claude's own commit message
          # (falls back to the request title if the branch can't be read).
          git fetch --depth=1 origin "$BRANCH" >/dev/null 2>&1 || true
          SUMMARY=$(git log -1 --format=%s "origin/$BRANCH" 2>/dev/null)
          [ -z "$SUMMARY" ] && SUMMARY="$TITLE"
          BODY=$(printf '%s\n\nFixes #%s · [View the original request](%s/%s/issues/%s)' \
            "$SUMMARY" "$ISSUE" "$SERVER" "$REPO" "$ISSUE")
          # Security PRs get assigned to Roger so he's notified for sign-off.
          ASSIGN=""
          if [ "$IS_SECURITY" = "true" ]; then ASSIGN="--assignee rogerfoxcroft"; fi
          gh pr create --repo "$REPO" --base main --head "$BRANCH" \
            --title "$TITLE" \
            --body "$BODY" \
            $ASSIGN \
            || echo "::warning::Couldn't auto-open the PR (needs 'Allow GitHub Actions to create and approve pull requests' in Settings → Actions → General, or a PAT with Pull requests: write). Branch $BRANCH is pushed and the 'Create PR' link on the issue still works."
