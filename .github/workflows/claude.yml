name: Claude handles issues

# Marketing files a plain-English issue (or comments @claude on an existing one).
# Claude reads the repo (guided by /CLAUDE.md), asks clarifying questions if
# needed, then opens a PR with the changes.
#
# Requires repo secret ANTHROPIC_API_KEY (or use the /install-github-app command
# from Claude Code, which sets it up automatically).
on:
  issues:
    types: [opened, edited, assigned, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude:
    runs-on: ubuntu-latest
    # Fast-path: skip PR-comment events on PRs Claude itself opened, so it
    # doesn't keep responding to its own comment threads.
    if: ${{ !(github.event_name == 'issue_comment' && github.event.issue.pull_request && startsWith(github.head_ref, 'claude/')) }}
    steps:
      - uses: actions/checkout@v4
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          trigger_phrase: "@claude"
          # Also fire when an issue is assigned to a user named "claude" or
          # labelled "claude", so marketing has three easy ways to invoke.
          assignee_trigger: "claude"
          label_trigger: "claude"
          # Prefix Claude's PR branches so it's obvious in the branch list.
          branch_prefix: "claude/"
