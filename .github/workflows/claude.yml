name: Claude handles issues

# Marketing files a plain-English issue (or comments @claude on an existing one,
# or labels/assigns it "claude"). Claude reads the repo (guided by /CLAUDE.md),
# asks clarifying questions if needed, then opens a PR with the changes.
#
# Auth:
#   CLAUDE_CODE_OAUTH_TOKEN — Claude Max/Pro subscription token, generated with
#     `claude setup-token` (uses the subscription, not API credits).
#   CLAUDE_GITHUB_TOKEN — a fine-grained GitHub PAT scoped to this repo, used
#     for checkout and Claude's branch/PR/comment operations.

on:
  issues:
    types: [opened, labeled, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: false

jobs:
  claude:
    # Three documented ways to trigger, plus @claude on PR reviews:
    #   1. Open any new issue.
    #   2. Comment @claude on an issue or PR.
    #   3. Label an issue `claude` or assign it to `claude`.
    if: |
      (github.event_name == 'issues' && github.event.action == 'opened') ||
      (github.event_name == 'issues' && github.event.action == 'labeled' && github.event.label.name == 'claude') ||
      (github.event_name == 'issues' && github.event.action == 'assigned' && github.event.assignee.login == 'claude') ||
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.CLAUDE_GITHUB_TOKEN }}

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        env:
          # Exposed to Claude's shell so it can download issue attachments, which
          # live at github.com/user-attachments/... and require authentication
          # (they are NOT public, even on a public repo). See CLAUDE.md.
          GH_ATTACHMENT_TOKEN: ${{ secrets.CLAUDE_GITHUB_TOKEN }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.CLAUDE_GITHUB_TOKEN }}
          # curl: download images (issue attachments need the auth header above;
          #   pasted public URLs don't). convert/magick: resize or convert an
          #   asset to a web-friendly format when marketing supplies the wrong one.
          claude_args: "--allowedTools 'Bash(npm ci),Bash(npm install *),Bash(npm run *),Bash(git add:*),Bash(git commit:*),Bash(git rm:*),Bash(curl:*),Bash(convert:*),Bash(magick:*)'"
