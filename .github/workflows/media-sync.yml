name: Sync media (Google Drive → R2)

# Mirrors the show media from the Google Shared Drive to Cloudflare R2 and keeps
# the galleries in step. Marketing drops files into the Shared Drive (one folder
# per show, named exactly like the show's page slug).
#
# Runs nightly, and can be triggered by hand. It's cheap on quiet nights: it
# mirrors originals Drive→R2 directly (only *changed* files move), and only if
# something actually changed does it regenerate thumbnails + the manifest and
# open a PR. So a no-change night moves almost nothing and finishes in minutes.
#
# Auth (all keyless on the Google side):
#   - Google Drive: Workload Identity Federation — a short-lived read-only Drive
#     token via OIDC (no service-account key stored anywhere).
#   - R2: an Object Read & Write token (the only secrets this workflow needs).
#
# Config lives in repo Settings → Secrets and variables → Actions:
#   Variables: WIF_PROVIDER, GDRIVE_SA_EMAIL, GDRIVE_SHARED_DRIVE_ID,
#              GDRIVE_MEDIA_PATH (folder within the Shared Drive; blank = root),
#              R2_ENDPOINT (e.g. https://<acct>.eu.r2.cloudflarestorage.com)
#   Secrets:   R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY

on:
  workflow_dispatch: {}
  schedule:
    - cron: '20 3 * * *'   # nightly ~03:20 UTC (03:20 GMT / 04:20 BST)

permissions:
  contents: write
  id-token: write        # required for the WIF OIDC token
  pull-requests: write

concurrency:
  group: media-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # PAT so the manifest branch can be pushed (contents: write)
          token: ${{ secrets.CLAUDE_GITHUB_TOKEN }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Authenticate to Google (WIF → read-only Drive token)
        id: gauth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.GDRIVE_SA_EMAIL }}
          token_format: access_token
          access_token_scopes: https://www.googleapis.com/auth/drive.readonly

      - name: Install rclone
        run: curl -fsSL https://rclone.org/install.sh | sudo bash

      # One step: the Drive token comes from the step output above, so all the
      # rclone env (which references it) has to live here.
      - name: Sync Drive → R2 and rebuild the manifest
        id: sync
        env:
          # --- Google Drive (read-only, short-lived WIF token) ---
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.readonly
          RCLONE_CONFIG_GDRIVE_TEAM_DRIVE: ${{ vars.GDRIVE_SHARED_DRIVE_ID }}
          RCLONE_CONFIG_GDRIVE_TOKEN: '{"access_token":"${{ steps.gauth.outputs.access_token }}","token_type":"Bearer","expiry":"2099-01-01T00:00:00Z"}'
          # --- Cloudflare R2 (write) ---
          RCLONE_CONFIG_R2_TYPE: s3
          RCLONE_CONFIG_R2_PROVIDER: Cloudflare
          RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RCLONE_CONFIG_R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          RCLONE_CONFIG_R2_ACL: private
          RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
          MEDIA_PATH: ${{ vars.GDRIVE_MEDIA_PATH }}
        run: |
          set -euo pipefail

          # SAFETY: the mirror prunes R2 files absent from the Drive, so a
          # half-copied Drive could wipe real media. Abort if the Drive has fewer
          # show folders than the manifest already knows about. (Adding shows is
          # fine; a genuine show removal will also trip this — re-run to proceed.)
          echo "::group::Safety check — is the Drive complete?"
          DRIVE_SHOWS=$(rclone lsf "gdrive:${MEDIA_PATH}" --dirs-only | grep -c / || true)
          EXPECTED=$(node -e "try{console.log(Object.keys(require('./src/data/photo-manifest.json').shows).length)}catch{console.log(0)}")
          echo "Drive show folders: $DRIVE_SHOWS — manifest expects: $EXPECTED"
          if [ "$DRIVE_SHOWS" -eq 0 ] || [ "$DRIVE_SHOWS" -lt "$EXPECTED" ]; then
            echo "::error::Drive looks incomplete ($DRIVE_SHOWS < $EXPECTED) — aborting before any destructive mirror."
            exit 1
          fi
          echo "::endgroup::"

          echo "::group::Mirror originals Drive → R2 (only changed files move)"
          rclone sync "gdrive:${MEDIA_PATH}" "r2:myts-media" \
            --exclude "_*/**" --exclude ".*" --checksum --max-delete 200 \
            --transfers 16 --checkers 24 --fast-list --stats 30s -v 2>&1 | tee /tmp/orig.log
          echo "::endgroup::"

          CHANGES=$(grep -cE ': (Copied|Deleted|Updated)' /tmp/orig.log || true)
          echo "Originals added/updated/removed this run: $CHANGES"
          if [ "$CHANGES" -eq 0 ]; then
            echo "Nothing changed in the Shared Drive — R2 already matches, no thumbnail/manifest work needed."
            exit 0
          fi

          echo "::group::Changes detected — rebuild thumbnails + manifest"
          # Pull the (now current) originals from R2 to regenerate derivatives and
          # read dimensions for the manifest. Fresh ./_myts-web ⇒ everything is
          # regenerated, so rotated/edited photos get correct new derivatives.
          rclone copy "r2:myts-media" ./MYTS \
            --exclude "_*/**" --fast-list --transfers 24 --checkers 24 --stats 30s
          npm ci
          node scripts/media-ingest.mjs \
            --root ./MYTS --out ./_myts-web --manifest src/data/photo-manifest.json
          echo "::endgroup::"

          echo "::group::Mirror derivatives to R2 (checksum; prunes stale)"
          rclone sync ./_myts-web "r2:myts-media/_web" \
            --checksum --max-delete 400 --transfers 24 --checkers 24 --stats 30s
          echo "::endgroup::"

      - name: Open a PR if the manifest changed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if git diff --quiet -- src/data/photo-manifest.json; then
            echo "No manifest changes — nothing to merge."
            exit 0
          fi
          BR="claude/media-sync-$(date -u +%Y%m%d-%H%M%S)"
          git config user.name "myts-media-bot"
          git config user.email "media-bot@users.noreply.github.com"
          git switch -c "$BR"
          git add src/data/photo-manifest.json
          git commit -m "Media sync: update photo manifest from the Shared Drive"
          git push origin "$BR"
          gh pr create --repo "$REPO" --base main --head "$BR" \
            --title "Media sync: gallery/manifest update" \
            --body "Automated media sync from the Google Shared Drive. New/removed photos and programme PDFs have been mirrored to R2; this updates the manifest so the galleries match. Review and merge to publish." \
            || echo "::warning::Couldn't auto-open the PR. Branch $BR is pushed — open it from there."
